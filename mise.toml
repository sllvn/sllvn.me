[tools]
zola = "0.19.2"

[tasks.dev]
description = "Start development server"
run = "zola serve"

[tasks.build]
description = "Build site locally (for debugging)"
run = "zola build"

[tasks.new-post]
description = "Create a new blog post skeleton"
raw = true
run = "uv run newpost.py"

[tasks.new-nota]
description = "Create a new nota skeleton"
raw = true
run = "uv run newpost.py --notas"

[tasks.resize-image]
description = "Resize and optimize an image for posts"
raw = true
run = "uv run resize_image.py"
